dependencies {
    // Provides the documentation API
    implementation 'io.github.springwolf:springwolf-kafka:3.0.0'

    // Provides the AsyncAPI document endpoint - optional (recommended)
    implementation 'io.github.springwolf:springwolf-web:3.0.0'

    // Provides the UI - optional (recommended), requires springwolf-web
    runtimeOnly 'io.github.springwolf:springwolf-ui:3.0.0'
}
